Description: Highly available Web App, web-app configuration.

Parameters:
  EnvironmentName:
    Description: An environment name that will be prefixed to resource names
    Type: String

  S3Bucket:
    Description: The name of the S3 bucket hosting our static files
    Type: String

  S3BucketCode:
    Description: The bundle with our static files
    Type: String

  TheKeyPair:
    Description: The name of the KeyPair
    Type: String


  # SSH into the bastion used to be open to 0.0.0.0/0 (checkov CKV_AWS_24). A bastion
  # exists to be the single reachable entry point, which makes restricting it the whole
  # point rather than an optional extra. No default on purpose.
  AdminCidr:
    Description: >-
      CIDR allowed to SSH into the bastion host. Use your own address or VPN range, e.g.
      203.0.113.10/32. 0.0.0.0/0 is rejected.
    Type: String
    AllowedPattern: '^(?!0\.0\.0\.0/0$)(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2\d|3[0-2])$'
    ConstraintDescription: Must be an IPv4 CIDR no broader than /16, and not 0.0.0.0/0.
  CertificateArn:
    Description: >-
      ARN of an ACM certificate in this region, for the HTTPS listener. Leave it empty and
      the stack deploys HTTP only, exactly as the original template did. Supply one and a
      TLS 1.2 listener is added on 443 and port 80 becomes a 301 redirect to it.
    Type: String
    Default: ''

Conditions:
  # An HTTPS listener needs a certificate, and there is no sensible default for one, so
  # the TLS resources are conditional rather than mandatory. That keeps `aws cloudformation
  # deploy` working for someone reading this repo who has no certificate to hand.
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources: 
  LBSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to our load balancer
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere, which is what a public load balancer is for
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP to the web server targets

  WebServerSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http to our hosts and SSH through bastion host
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VPCID'
      SecurityGroupIngress:
        - SourceSecurityGroupId: !Ref LBSecGroup
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          Description: HTTP from the load balancer only
        - SourceSecurityGroupId: !Ref BastionHostSecGroup
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          Description: SSH from the bastion host only
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
          Description: All outbound, needed to fetch packages and the app bundle

  BastionHostSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH into the bastion from the administrator CIDR only
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH from the administrator CIDR
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: All outbound, so the bastion can reach the private subnets

  UdacityS3ReadOnlyEC2:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'

  RolePolicies:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: 'S3GetAndListEC23Policy'
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub 'arn:aws:s3:::${S3Bucket}/*'
          - Action: s3:ListBucket
            Effect: Allow
            Resource: !Sub 'arn:aws:s3:::${S3Bucket}'
      Roles:
        - Ref: 'UdacityS3ReadOnlyEC2'

  ProfileWithRolesForOurApp:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: 'UdacityS3ReadOnlyEC2'

  WebAppLaunchConfig:
    Type: AWS::AutoScaling::LaunchConfiguration
    Properties:
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          sudo yum update -y
          sudo yum install unzip awscli -y
          sudo yum install httpd -y
          sudo systemctl start httpd.service
          cd /var/www/html
          aws s3 cp s3://${S3Bucket}/${S3BucketCode} .
          unzip -o ${S3BucketCode}
      ImageId: ami-0a887e401f7654935
      IamInstanceProfile: !Ref ProfileWithRolesForOurApp
      SecurityGroups:
        - Ref: WebServerSecGroup
      InstanceType: t3.small
      KeyName: !Ref TheKeyPair
      BlockDeviceMappings:
        - DeviceName: '/dev/sdk'
          Ebs:
            # Encrypted at rest (checkov CKV_AWS_8). Encryption can only be set when the
            # volume is created, so an existing stack needs replacement, not an update.
            Encrypted: true
            VolumeType: gp2
            VolumeSize: '10'
  
  WebAppGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PRIV-NETS'
      LaunchConfigurationName:
        Ref: WebAppLaunchConfig
      MinSize: '1'
      MaxSize: '1'
      TargetGroupARNs:
        - Ref: WebAppTargetGroup
      Tags:
        - Key: Name
          Value: WebAppServer
          PropagateAtLaunch: "true"
  
  WebAppLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PUB1-SN'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PUB2-SN'
      SecurityGroups:
        - Ref: LBSecGroup
      LoadBalancerAttributes:
        # Access logging (checkov CKV_AWS_91). Without it there is no record of what was
        # requested, which is the one thing you want after an incident.
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref LBAccessLogsBucket
        # Headers that are not valid HTTP are dropped instead of being handed to the
        # targets (checkov CKV_AWS_131), which is what closes the desync/smuggling class
        # of tricks where the load balancer and the backend disagree on a request.
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
    # The bucket policy must exist before the load balancer, because Elastic Load
    # Balancing writes a test object at creation time and fails the stack if it cannot.
    DependsOn: LBAccessLogsBucketPolicy
  
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      # With a certificate, port 80 exists only to send clients to 443. Without one it
      # forwards, so the demo still works over plain HTTP.
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref WebAppTargetGroup
      LoadBalancerArn:
        Ref: WebAppLB
      Port: 80
      Protocol: 'HTTP'
  # TLS 1.2 only (checkov CKV_AWS_2 and CKV_AWS_103). ELBSecurityPolicy-TLS-1-2-2017-01
  # is the oldest policy that excludes TLS 1.0 and 1.1 outright, so it is both correct
  # and available to a template of this vintage.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebAppTargetGroup
      LoadBalancerArn:
        Ref: WebAppLB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
  
  ALBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebAppTargetGroup
      Conditions:
        - Field: path-pattern
          Values: [/]
      # Attach to the HTTPS listener when there is one; port 80 only redirects then.
      ListenerArn: !If [HasCertificate, !Ref HttpsListener, !Ref Listener]
      Priority: 1
  
  WebAppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 8
      HealthyThresholdCount: 2
      Port: 80
      Protocol: HTTP
      UnhealthyThresholdCount: 5
      VpcId:
        Fn::ImportValue:
          Fn::Sub: '${EnvironmentName}-VPCID'
    
  BastionHost1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-07ebfd5b3428b6f4d
      InstanceType: t2.micro
      KeyName: !Ref TheKeyPair
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PUB1-SN'
      #AvailabilityZone: !Select [0, !GetAZs '']
      SecurityGroupIds:
        - Ref: BastionHostSecGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} Bastion Host 1

  BastionHost2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-07ebfd5b3428b6f4d
      InstanceType: t2.micro
      KeyName: !Ref TheKeyPair
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PUB2-SN'
      #AvailabilityZone: !Select [0, !GetAZs '']
      SecurityGroupIds: 
        - Ref: BastionHostSecGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName} Bastion Host 2


  LBAccessLogsBucket:
    Type: AWS::S3::Bucket
    # No BucketName: the name is generated. EnvironmentName carries capitals in the
    # committed parameter files and bucket names must be lowercase.
    Properties:
      # ALB access log delivery supports SSE-S3 only. A KMS key here makes delivery fail
      # with an access-denied that is very hard to trace back to encryption.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-access-logs
            Status: Enabled
            ExpirationInDays: 90
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: >-
              This IS the log bucket. S3 server access logging on it would either need a
              second bucket that has the same problem, or point at itself and log its own
              log writes forever.

  LBAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LBAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # The log delivery service principal, which is what AWS documents today and
          # which works in every region. Regions that existed before August 2022 also
          # still accept the older policy naming a per-region Elastic Load Balancing
          # account ID; see the README.
          - Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${LBAccessLogsBucket}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              ArnLike:
                # Only load balancers in this account and region may write here.
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*'

Outputs:
  WebAppLB:
    Description: A reference to the created WebAppLB DNS
    Value: !GetAtt WebAppLB.DNSName
    Export:
      Name: !Sub ${EnvironmentName}-PWebAppLB-DNS

  BastionHost1:
    Description: DNS of Bastion Host 1
    Value: !GetAtt BastionHost1.PublicDnsName
    Export:
      Name: !Sub ${EnvironmentName}-BastionHost1-DNS   

  BastionHost2:
    Description: DNS of Bastion Host 2
    Value: !GetAtt BastionHost2.PublicDnsName
    Export:
      Name: !Sub ${EnvironmentName}-BastionHost2-DNS   