Description: Aurora Serverless cluster for YourService

Parameters:
  Service:
    Description: Name of the Service
    Type: String
    Default: 'YourService'

  VpcID:
    Description: The VPC ID
    Type: String
    Default: vpc-******

  PrivateSubnet1CIDR:
    Description: IP range subnet AZ1
    Type: String
    Default: '*.*.10.0/24'

  PrivateSubnet2CIDR:
    Description: IP range subnet AZ2
    Type: String
    Default: '*.*.11.0/24'


  # The password is no longer a stack parameter. A NoEcho parameter still travels
  # through the API call, the CLI history and any CI log that echoes the command, and
  # cfn-lint flags it as W1011. A dynamic reference is resolved by CloudFormation at
  # deploy time and never appears in the template, the stack events or a describe call.
  #
  # Create the secret first:
  #   aws secretsmanager create-secret --name aurora/master \
  #     --secret-string '{"username":"yourdbuser","password":"<generated>"}'
  DBSecretName:
    Description: >-
      Name or ARN of a Secrets Manager secret holding a JSON body with "username" and
      "password" keys. The values are read at deploy time and never stored in the stack.
    Type: String
    Default: aurora/master
    MinLength: 1

  DatabaseName:
    Description: DB name
    Type: String

  HostedZone:
    Description: Hosted Zone
    Type: String

  # SSH used to be open to 0.0.0.0/0 (checkov CKV_AWS_24). There is deliberately no
  # default: a template that ships with the whole internet allowed on port 22 is one
  # copy-paste away from an exposed host.
  AdminCidr:
    Description: >-
      CIDR allowed to reach SSH. Use your own address or VPN range, e.g.
      203.0.113.10/32. 0.0.0.0/0 is rejected.
    Type: String
    AllowedPattern: '^(?!0\.0\.0\.0/0$)(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2\d|3[0-2])$'
    ConstraintDescription: >-
      Must be an IPv4 CIDR no broader than /16, and not 0.0.0.0/0.
Resources:
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcID
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-sn1
        - Key: Service
          Value: !Ref Service

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Sub ${VpcID}
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-sn2
        - Key: Service
          Value: !Ref Service

  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ClientSecurityGroup
          Description: PostgreSQL from the client security group only
      VpcId: !Sub ${VpcID}
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sec-group
        - Key: Service
          Value: !Ref Service

  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} CLIENT security group
      VpcId: !Sub ${VpcID}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH from the administrator CIDR
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: All outbound, so the client can reach the cluster and the Internet
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-CLIENT-sec-group
        - Key: Service
          Value: !Ref Service

  myDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${AWS::StackName} subnet group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-subnet-group
        - Key: Service
          Value: !Ref Service

  RDSCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecretName}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretName}:SecretString:password}}'
      DatabaseName: !Ref DatabaseName # check naming constraints in Amazon RDS
      EnableHttpEndpoint: true
      Engine: aurora-postgresql
      EngineMode: serverless
      EngineVersion: 10.7
      BackupRetentionPeriod: 35
      DeletionProtection: false # turn true once it is final
      StorageEncrypted: true
      ScalingConfiguration:
        AutoPause: true
        MaxCapacity: 16 # aka, 32GB of RAM
        MinCapacity: 2 # aka, 4GB of RAM
        SecondsUntilAutoPause: 500
      DBSubnetGroupName: !Ref myDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref ClusterSecurityGroup
      # Note: Value of property VpcSecurityGroupIds must be of type List of String
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-aurora-sls
        - Key: Service
          Value: !Ref Service

  CNAME:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Ref HostedZone
      # ${...} only interpolates inside Fn::Sub. This read "CNAME for !Sub
      # ${AWS::StackName}", where the tag sits mid-scalar, so YAML treated the whole
      # thing as literal text and the comment shipped with a stray !Sub in it.
      Comment: !Sub 'CNAME for ${AWS::StackName}'
      RecordSets:
        - Name: !Join
            - ''
            - - !Sub ${AWS::StackName}
              - '.'
              - !Ref HostedZone
          Type: CNAME
          TTL: '60'
          ResourceRecords:
            - !GetAtt RDSCluster.Endpoint.Address

Outputs:

  CNAME:
    Description: Endpoint to connect to the Cluster
    Value: !Join
            - ''
            - - !Sub ${AWS::StackName}
              - '.'
              - !Ref HostedZone
    Export:
      Name: !Sub ${Service}-db-CNAME

  ClientSecurityGroup:
    Description: Security Group for CLIENT
    Value: !Ref ClientSecurityGroup
    Export:
      Name: !Sub ${Service}-db-CLIENT-SEC-GROUP