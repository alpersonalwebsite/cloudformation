Description: CLIENT > Aurora Serverless cluster for YourService

Parameters:
  Service:
    Description: Name of the Service
    Type: String
    Default: 'YourService'

  VpcID:
    Description: The VPC the cluster and its client live in
    # AWS::EC2::VPC::Id rather than String: the console offers a dropdown of real VPCs
    # and a typo is rejected at validate time instead of failing mid-create. The old
    # placeholder default (vpc-******) was not a deployable value anyway, so there is
    # nothing to keep.
    Type: AWS::EC2::VPC::Id

  PublicSubnetCIDR:
    Description: IP range subnet AZ1
    Type: String
    Default: '10.0.12.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$'
    ConstraintDescription: Must be an IPv4 CIDR between /16 and /28.

Resources:
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcID
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-sn
        - Key: Service
          Value: !Ref Service
  
  # Assumes there is a Production PUBLIC Routing table created with the provided Route table ID
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: 'rtb-********'
      SubnetId: !Ref PublicSubnet

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: 'ami-0323c3dd2da7fb37d'
      InstanceType: 't2.micro'
      # Assumes you have this key or you are going to create it
      KeyName: 'YourServiceClientKP'
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
          DeviceIndex: '0'
          GroupSet:
            - Fn::ImportValue: !Sub '${Service}-db-CLIENT-SEC-GROUP'
          SubnetId:
            Ref: 'PublicSubnet'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-ec2
        - Key: Service
          Value: !Ref Service