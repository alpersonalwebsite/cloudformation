Description: ECS Task Execution IAM Role
# https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html

Parameters:
  EnvironmentName:
    Description: An environment name that will be prefixed to resource names
    Type: String

Resources:
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ecs-tasks.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      Policies:
        - PolicyName: AmazonECSTaskExecutionRolePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
            # One statement with Resource: '*' covering all six actions was the original
            # (checkov CKV_AWS_111). It is split three ways now, because only the first
            # action genuinely has no resource to name.
            - Sid: EcrAuthToken
              Effect: Allow
              # ecr:GetAuthorizationToken is account-scoped by design: there is no
              # resource ARN for it, so '*' here is correct rather than lazy.
              Action: 'ecr:GetAuthorizationToken'
              Resource: '*'
            - Sid: PullImagesFromThisAccount
              Effect: Allow
              Action:
                - 'ecr:BatchCheckLayerAvailability'
                - 'ecr:GetDownloadUrlForLayer'
                - 'ecr:BatchGetImage'
              # Repositories in this account and region only. Narrow it further to the
              # single repository you actually deploy from if you know its name.
              Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
            - Sid: WriteTaskLogs
              Effect: Allow
              Action:
                - 'logs:CreateLogStream'
                - 'logs:PutLogEvents'
              # The log group cluster.yml creates, and its streams. Not every log group
              # in the account, which is what '*' granted.
              Resource:
                - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:web-app'
                - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:web-app:log-stream:*'

Outputs:
  ECSTaskExecutionRole:
    Description: ECS Task Execution Role
    Value: !GetAtt 'ECSTaskExecutionRole.Arn'
    Export:
      Name: !Sub ${EnvironmentName}-ECSTaskExecutionRole