AWSTemplateFormatVersion: 2010-09-09
Description: Create a DB replica in the other region

Parameters:
  DBInstanceID:
    Default: mydbinstancereplica
    Description: My database instance
    Type: String
    MinLength: '1'
    MaxLength: '63'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: >-
      Must begin with a letter and must not end with a hyphen or contain two
      consecutive hyphens.
  DBInstanceClass:
    Default: db.t2.micro
    Description: DB instance class
    Type: String
    ConstraintDescription: Must select a valid DB instance type.
  DBName:
    Default: mydb
    Description: My database
    Type: String
    MinLength: '1'
    MaxLength: '64'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters.

  # The source used to be hardcoded as
  # arn:aws:rds:us-east-1:your-admin-account-id:db:mydbinstance, so the template could
  # not deploy without editing it, and the placeholder account id was easy to miss.
  SourceDBInstanceID:
    Default: mydbinstance
    Description: Identifier of the primary DB instance being replicated.
    Type: String
    MinLength: 1
  SourceDBRegion:
    Default: us-east-1
    Description: Region the primary DB instance lives in.
    Type: String
    MinLength: 1

Resources:
  myDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: DB Subnet Group
      SubnetIds:
        - Fn::ImportValue: !Sub 'Secondary-PRIV1-SN'
        - Fn::ImportValue: !Sub 'Secondary-PRIV2-SN'

  MyDBreplica: 
    Type: 'AWS::RDS::DBInstance'
    Properties: 
      DBInstanceIdentifier: !Ref DBInstanceID
      DBName: !Ref DBName
      DBInstanceClass: !Ref DBInstanceClass
      SourceDBInstanceIdentifier: !Sub arn:${AWS::Partition}:rds:${SourceDBRegion}:${AWS::AccountId}:db:${SourceDBInstanceID}
      SourceRegion: !Ref SourceDBRegion
      # No StorageEncrypted here. A read replica inherits encryption from its source,
      # and setting it is rejected: cfn-lint E3020, "'StorageEncrypted' should not be
      # included with 'SourceDBInstanceIdentifier'". The primary sets it, so the replica
      # is encrypted too. checkov CKV_AWS_16 still flags this resource, which is a false
      # positive for a replica.
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref myDBSubnetGroup
      # MonitoringInterval: '60'
      # MonitoringRoleArn: !Ref MyDBRole
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub 'Secondary-DatabaseSecurityGroup'