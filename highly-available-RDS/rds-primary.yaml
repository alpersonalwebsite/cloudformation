AWSTemplateFormatVersion: 2010-09-09
Description: Create a DB instance

Parameters:
  DBInstanceID:
    Default: mydbinstance
    Description: My database instance
    Type: String
    MinLength: '1'
    MaxLength: '63'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: >-
      Must begin with a letter and must not end with a hyphen or contain two
      consecutive hyphens.

  DBName:
    Default: mydb
    Description: My database
    Type: String
    MinLength: '1'
    MaxLength: '64'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters.

  DBInstanceClass:
    Default: db.t2.micro
    Description: DB instance class
    Type: String
    ConstraintDescription: Must select a valid DB instance type.

  DBAllocatedStorage:
    Default: '20'
    Description: The size of the database (GiB)
    Type: Number
    MinValue: '20'
    MaxValue: '30'
    ConstraintDescription: must be between 20 and 30 GiB.


  # Not a NoEcho parameter any more: a NoEcho value still travels through the API call,
  # the CLI history and any CI log that echoes the command (cfn-lint W1011). A dynamic
  # reference is resolved by CloudFormation at deploy time and never lands in the
  # template, the stack events or a describe-stacks response.
  #
  #   aws secretsmanager create-secret --name rds/primary \
  #     --secret-string '{"username":"dbuser","password":"<generated>"}'
  DBSecretName:
    Description: >-
      Name or ARN of a Secrets Manager secret holding a JSON body with "username" and
      "password" keys.
    Type: String
    Default: rds/primary
    MinLength: 1


Resources:
  myDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: DB Subnet Group
      SubnetIds:
        - Fn::ImportValue: !Sub 'Primary-PRIV1-SN'
        - Fn::ImportValue: !Sub 'Primary-PRIV2-SN'

  MyDBRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: MyDBEnhancedMonitoringRole
      # This is an AWS managed policy
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole'
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: 'monitoring.rds.amazonaws.com'
            Action: 'sts:AssumeRole'

  MyDB:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBInstanceIdentifier: !Ref DBInstanceID
      DBName: !Ref DBName
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      DBSubnetGroupName: !Ref myDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub 'Primary-DatabaseSecurityGroup'
      MultiAZ: true
      Engine: MySQL
      # 8.0.17 is what this template was written against. RDS no longer accepts it for
      # NEW instances (cfn-lint W3691: "deprecated and cannot be used to create new RDS
      # DB instances"), so a deploy today fails until you raise it. Kept for period
      # accuracy; pass a supported 8.0.x via EngineVersion when you deploy.
      EngineVersion: 8.0.17
      # Encryption at rest was absent (checkov CKV_AWS_16), while the Aurora template in
      # this repo sets it. It can only be enabled at creation time, so retrofitting a
      # live instance means a snapshot-and-restore.
      StorageEncrypted: true
      # A "highly available" database with no backups is not one. 7 days of automated
      # backups, and deletion protection so a stack delete cannot take the data with it.
      BackupRetentionPeriod: 7
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - error
        - slowquery
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecretName}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecretName}:SecretString:password}}'
      # MonitoringInterval: '60'
      # MonitoringRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/AWSCloudFormationStackSetExecutionRole
